<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разместить товар - QuickBuy</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <header>
        <h1>QuickBuy - Разместить товар</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
        </nav>
    </header>

    <section>
        <h2>Добавление товара</h2>
        <form>
            <label for="name">Название:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="description">Описание:</label>
            <textarea id="description" name="description" rows="4" required></textarea><br><br>

            <label for="price">Цена:</label>
            <input type="number" id="price" name="price" step="0.01" required><br><br>

            <label for="image">Изображение:</label>
            <input type="file" id="image" name="image" accept="image/*"><br><br>

            <label for="category">Категория:</label>
            <select id="category" name="category">
                <option value="electronics">Электроника</option>
                <option value="pets">Товары для животных</option>
                <option value="clothing">Одежда и обувь</option>
            </select><br><br>

            <button type="submit">Добавить товар</button>
        </form>
    </section>

    <footer>
        <div class="footer-content">
            <div class="dev-info">
                <p>QuickBuy</p>
                <p>Игнатьев Алексей</p>
                <p>Группа: 4321-21</p> 
            </div>
            <div class="social-links">
                <a href="ссылка_на_вк" target="_blank">
                    <img src="vk_1.png" width="30" height="30" alt="VK">
                </a>
                <a href="ссылка_на_телеграм" target="_blank">
                    <img src="OK.png" width="50" height="30" alt="Telegram">
                </a>
            </div>
        </div>
        
    </footer>
</body>
</html>
